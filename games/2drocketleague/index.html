<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"><meta name="robots" content="noindex,follow"><script src="../../shared/platform.js"></script><link rel="stylesheet" href="../../shared/game.css">




  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <title>Rocket League 2d</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="../../shared/vendor/jquery-classic.min.js"   crossorigin="anonymous"></script>
  <script src="../../shared/vendor/math.min.js"></script>
</head>
<body>
<audio src="assets/goal_impact.ogg" class="goal-impact"></audio>
<audio src="assets/goal_horn.ogg" class="goal-horn"></audio>
<audio src="assets/ball-hit.ogg" class="ball-hit"></audio>
<audio src="assets/two-minute-warning.ogg" class="two-minute-warning"></audio>
<audio src="assets/timer-running-out.ogg" class="timer-running-out"></audio>
<audio src="assets/game-over.ogg" class="game-over"></audio>

<!-- ScoreBoard and Timer -->
<div>
  <div class="center">
    <div class="scoreboard orange"></div>
    <div class="spacer"></div>
    <div class="logo-timer">
      <img class="logo" src="assets/rocket-league-header.png" alt="">
      <img class="twod-logo" src="assets/2d_white1.png" alt="">
    </div>
    <div class="spacer"></div>
    <div class="scoreboard blue"></div>
  </div>
</div>

<!-- Start Match Button -->
<div class="start-button">
  Start Match
</div>

<!-- Play Instructions -->
<div class="instructions">
  <div class="controls">
    Controls
  </div>
  <div id="control-diagram">
    <div class="car-image">
      <img src="assets/Car_orange.png" alt="">
    </div>
    <div id="orange-controls">
      <p>W</p>
      <p>S</p>
      <p>A</p>
      <p>D</p>
    </div>
    <div id="controls-text">
      <p>Accelerate</p>
      <p>Brake/Reverse</p>
      <p>Turn Left</p>
      <p>Turn Right</p>
    </div>
    <div id="blue-controls">
      <p>&uarr;</p>
      <p>&darr;</p>
      <p>&larr;</p>
      <p>&rarr;</p>
    </div>
    <div class="car-image">
      <img src="assets/Car_blue.png" alt="">
    </div>
  </div>
</div>

<!-- Pop up on Game Over -->
<div class="game-over hidden">
  <div class="winner-announce"></div>
  <button class="play-again">Play Again?</button>
</div>

<script src="js/collisions.js"></script>
<script src="js/car_wall_collision.js"></script>
<script src="js/main.js"></script>
</body>
</html>
