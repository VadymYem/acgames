<!DOCTYPE html>
<html lang="en">
<head>
<script>
// AuthorChe Clean Game Wrapper - Ad & Tracker Blocker
window.PokiSDK = {
  init: function(){ return Promise.resolve(); },
  initWithVideoback: function(){ return Promise.resolve(); },
  customEvent: function(){},
  gameplayStart: function(){},
  gameplayStop: function(){},
  commercialBreak: function(){ return Promise.resolve(); },
  rewardedBreak: function(){ return Promise.resolve(true); },
  displayAd: function(){},
  destroyAd: function(){},
  setDebugTouchOverlayController: function(){},
  isAdBlocked: function(){ return false; }
};
window.CrazyGames = {
  SDK: {
    ad: {
      requestAd: function(type, callbacks){ if(callbacks && callbacks.adFinished) callbacks.adFinished(); },
      hasAdblock: function(){ return Promise.resolve(false); }
    },
    game: {
      gameplayStart: function(){},
      gameplayStop: function(){},
      happytime: function(){},
      loadingStart: function(){},
      loadingStop: function(){}
    },
    user: { isUserAccountAvailable: false }
  }
};
window.adsbygoogle = { push: function(){} };
window.open = function(url){ console.log("Blocked popup:", url); return null; };

	<meta charset="utf-8">
	<title>Untangle Puzzle Game in Canvas</title>
  <link href='http://fonts.googleapis.com/css?family=Rock+Salt' rel='stylesheet' type='text/css'>

</head>
<body>
	<section id="page">
		<header>
			<h1>Untangle Puzzle Game in Canvas</h1>
		</header>

		<div id="layers">
		  <canvas id="bg" width="768" height="400">
		    This is an interactive game with circles and lines connecting them.
		  </canvas>
		  <canvas id="guide" width="768" height="400"></canvas>
		  <canvas id="game" width="768" height="400"></canvas>
		  <canvas id="ui" width="768" height="400"></canvas>
		</div>

		<p>Puzzle <span id="level">0</span>, Completeness: <span id="progress">0</span>%</p>

		<footer>
			<p>This is an example of Untangle Puzzle Game in Canvas.</p>
		</footer>
	</section>
