<script>
// --- AUDIO SYSTEM (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'flap') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gainNode.gain.setValueAtTime(0.3, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'score') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.setValueAtTime(800, now + 0.1);
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
        gainNode.gain.setValueAtTime(0.5, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === 'powerup') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(1200, now + 0.4);
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
    }
}

// --- GAME VARIABLES ---
let scene, camera, renderer;
let bird, birdGroup;
let pipes = [], powerUps = [], clouds = [], particles = [];
let score = 0;
// Load high score from local storage or default to 0
let highScore = parseInt(localStorage.getItem('flappyHighScore')) || 0;

let isGameOver = false, isGameStarted = false;
let activePowerUp = null;
let frameId;

// Constants
const JUMP_FORCE = 0.16;
const GRAVITY = -0.0065;
const PIPE_SPEED = 0.045;
const PIPE_GAP_Y = 3.8;
const PIPE_SPAWN_X = 12;

const genZMotivations = [
    "Yass Queen, slay! 👑", "No cap, pure fire! 🔥", "Main Character Energy ✨", 
    "GOAT Status! 🐐", "Sheesh! 🥶", "Living rent free! 🏠", 
    "High key amazing! 🔑", "It's the vibe for me! 🌊", "Slaying the game! 💅", 
    "Big Brain Moves 🧠", "Periodt. 🛑", "Wig snatched! 💇‍♀️"
];

// --- INIT ---
function init() {
    // Scene Setup
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 10, 25);

    // Camera
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 9);

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.HemisphereLight(0xffffbb, 0x080820, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(-5, 10, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    createBird();
    createClouds(); 

    // Listeners
    document.addEventListener('keydown', handleInput);
    document.addEventListener('mousedown', (e) => {
        if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') handleInput(e);
    });
    document.addEventListener('touchstart', (e) => {
        if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') handleInput(e);
    }, {passive: false});
    
    window.addEventListener('resize', onWindowResize, false);

    // Set initial high score text
    document.getElementById('highScoreDisplay').textContent = highScore;

    animate();
}

// --- OBJECT CREATION ---
function createBird() {
    birdGroup = new THREE.Group();

    // Body
    const bodyGeo = new THREE.DodecahedronGeometry(0.4, 1); 
    const bodyMat = new THREE.MeshPhongMaterial({ color: 0xffcc00, flatShading: true });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true;
    birdGroup.add(body);

    // Eyes
    const eyeGeo = new THREE.SphereGeometry(0.12, 8, 8);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const pupilGeo = new THREE.SphereGeometry(0.05, 8, 8);
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(0.2, 0.15, 0.25);
    const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
    pupilL.position.z = 0.1;
    eyeL.add(pupilL);
    birdGroup.add(eyeL);

    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(0.2, 0.15, -0.25);
    const pupilR = new THREE.Mesh(pupilGeo, pupilMat);
    pupilR.position.z = 0.1;
    eyeR.add(pupilR);
    birdGroup.add(eyeR);

    // Beak
    const beakGeo = new THREE.ConeGeometry(0.15, 0.3, 8);
    const beakMat = new THREE.MeshPhongMaterial({ color: 0xff5722, flatShading: true });
    const beak = new THREE.Mesh(beakGeo, beakMat);
    beak.rotation.z = -Math.PI / 2;
    beak.position.set(0.45, -0.05, 0);
    birdGroup.add(beak);

    // Wings
    const wingGeo = new THREE.BoxGeometry(0.4, 0.1, 0.3);
    const wingMat = new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true });
    
    const wingL = new THREE.Mesh(wingGeo, wingMat);
    wingL.position.set(-0.1, 0, 0.35);
    wingL.name = "WingL";
    birdGroup.add(wingL);

    const wingR = new THREE.Mesh(wingGeo, wingMat);
    wingR.position.set(-0.1, 0, -0.35);
    wingR.name = "WingR";
    birdGroup.add(wingR);

    scene.add(birdGroup);
    
    bird = {
        mesh: birdGroup,
        velocity: 0,
        angle: 0
    };
}

function createClouds() {
    const cloudGeo = new THREE.BoxGeometry(1, 1, 1);
    const cloudMat = new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true, transparent: true, opacity: 0.8 });

    for (let i = 0; i < 15; i++) {
        const cloudGroup = new THREE.Group();
        const chunks = Math.floor(Math.random() * 3) + 3;
        
        for(let j=0; j<chunks; j++) {
            const m = new THREE.Mesh(cloudGeo, cloudMat);
            m.position.set(Math.random()*2-1, Math.random()*0.5, Math.random()*0.5);
            m.scale.set(Math.random()+1, Math.random()+0.5, Math.random()+0.5);
            cloudGroup.add(m);
        }

        cloudGroup.position.set(
            (Math.random() * 40) - 20,
            (Math.random() * 10) - 2,
            -5 - (Math.random() * 10) 
        );
        cloudGroup.userData = { speed: 0.01 + Math.random() * 0.02 };
        scene.add(cloudGroup);
        clouds.push(cloudGroup);
    }
}

function createPipe() {
    const pipeGroup = new THREE.Group();
    
    const pipeMat = new THREE.MeshPhongMaterial({ color: 0x4CAF50, shininess: 30, flatShading: false });
    const rimMat = new THREE.MeshPhongMaterial({ color: 0x388E3C, flatShading: false });
    
    const pipeRadius = 0.8;
    const pipeGeo = new THREE.CylinderGeometry(pipeRadius, pipeRadius, 15, 16);
    const rimGeo = new THREE.CylinderGeometry(pipeRadius + 0.1, pipeRadius + 0.1, 0.5, 16);

    const yOffset = (Math.random() * 6) - 3; 

    // Top Pipe
    const topPipe = new THREE.Mesh(pipeGeo, pipeMat);
    topPipe.position.y = 7.5 + (PIPE_GAP_Y / 2) + yOffset;
    topPipe.castShadow = true;
    topPipe.receiveShadow = true;
    
    const topRim = new THREE.Mesh(rimGeo, rimMat);
    topRim.position.y = -7.25;
    topPipe.add(topRim);

    // Bottom Pipe
    const botPipe = new THREE.Mesh(pipeGeo, pipeMat);
    botPipe.position.y = -7.5 - (PIPE_GAP_Y / 2) + yOffset;
    botPipe.castShadow = true;
    botPipe.receiveShadow = true;

    const botRim = new THREE.Mesh(rimGeo, rimMat);
    botRim.position.y = 7.25;
    botPipe.add(botRim);

    pipeGroup.add(topPipe);
    pipeGroup.add(botPipe);
    pipeGroup.position.x = PIPE_SPAWN_X;

    scene.add(pipeGroup);
    
    pipes.push({
        mesh: pipeGroup,
        passed: false
    });

    if (Math.random() < 0.15) {
        createPowerUp(PIPE_SPAWN_X + 2.5, yOffset); 
    }
}

function createPowerUp(x, y) {
    const geo = new THREE.OctahedronGeometry(0.35, 0);
    const mat = new THREE.MeshPhongMaterial({ color: 0xFFD700, emissive: 0xFFAA00, emissiveIntensity: 0.5, flatShading: true });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, 0);
    scene.add(mesh);
    powerUps.push(mesh);
}

function spawnParticles(pos, color) {
    const particleCount = 15;
    const geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
    const mat = new THREE.MeshBasicMaterial({ color: color });
    
    for (let i = 0; i < particleCount; i++) {
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        mesh.userData = {
            vel: new THREE.Vector3(
                (Math.random() - 0.5) * 0.3,
                (Math.random() - 0.5) * 0.3,
                (Math.random() - 0.5) * 0.3
            ),
            life: 1.0
        };
        scene.add(mesh);
        particles.push(mesh);
    }
}

// --- GAME LOGIC ---

function handleInput(e) {
    if (e.type === 'keydown' && e.keyCode !== 32) return;
    if (e.type === 'touchstart') e.preventDefault(); 

    if (isGameOver) return; 

    if (!isGameStarted) {
        isGameStarted = true;
        document.getElementById('startScreen').style.display = 'none';
        createPipe(); 
    }

    bird.velocity = JUMP_FORCE;
    playSound('flap');
    
    const wL = birdGroup.getObjectByName("WingL");
    const wR = birdGroup.getObjectByName("WingR");
    if(wL && wR) {
        wL.rotation.z = 0.8;
        wR.rotation.z = -0.8;
    }
}

function updatePhysics() {
    bird.velocity += GRAVITY;
    bird.mesh.position.y += bird.velocity;
    
    const targetRot = Math.max(-0.8, Math.min(0.6, bird.velocity * 5));
    bird.mesh.rotation.z = THREE.MathUtils.lerp(bird.mesh.rotation.z, targetRot, 0.1);
    
    const wL = birdGroup.getObjectByName("WingL");
    const wR = birdGroup.getObjectByName("WingR");
    if(wL && wR) {
        wL.rotation.z = THREE.MathUtils.lerp(wL.rotation.z, 0, 0.1);
        wR.rotation.z = THREE.MathUtils.lerp(wR.rotation.z, 0, 0.1);
    }

    // Trail
    if (isGameStarted && frameId % 5 === 0) {
         const trailGeo = new THREE.BoxGeometry(0.05, 0.05, 0.05);
         const trailMat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true});
         const t = new THREE.Mesh(trailGeo, trailMat);
         t.position.copy(bird.mesh.position);
         t.position.x -= 0.4;
         t.userData = { vel: new THREE.Vector3(-0.05,0,0), life: 0.5, shrink: true };
         scene.add(t);
         particles.push(t);
    }

    if (bird.mesh.position.y < -5.5 || bird.mesh.position.y > 5.5) {
        triggerGameOver();
    }
}

function updatePipes() {
    const birdBox = new THREE.Box3().setFromObject(bird.mesh);
    birdBox.expandByScalar(-0.15); 

    for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.mesh.position.x -= PIPE_SPEED;
        
        if (!activePowerUp) {
            const pX = p.mesh.position.x;
            const topY = p.mesh.children[0].position.y; 
            const botY = p.mesh.children[1].position.y; 
            const pipeWidth = 1.6; 
            
            if (bird.mesh.position.x > pX - pipeWidth/2 && bird.mesh.position.x < pX + pipeWidth/2) {
                 const ceiling = topY - 7.5 + p.mesh.position.y;
                 const floor = botY + 7.5 + p.mesh.position.y;
                 
                 if (bird.mesh.position.y > ceiling || bird.mesh.position.y < floor) {
                     triggerGameOver();
                 }
            }
        }

        if (!p.passed && p.mesh.position.x < bird.mesh.position.x) {
            p.passed = true;
            score++;
            updateScoreUI();
            playSound('score');
            
            const s = 1.2;
            bird.mesh.scale.set(s,s,s);
        }

        if (p.mesh.position.x < -10) {
            scene.remove(p.mesh);
            pipes.splice(i, 1);
        }
    }

    if (pipes.length > 0 && pipes[pipes.length - 1].mesh.position.x < PIPE_SPAWN_X - 6) {
        createPipe();
    }
    
    bird.mesh.scale.lerp(new THREE.Vector3(1,1,1), 0.1);
}

function updatePowerUps() {
    const birdBox = new THREE.Box3().setFromObject(bird.mesh);
    
    for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        pu.position.x -= PIPE_SPEED;
        pu.rotation.y += 0.05;
        pu.rotation.x += 0.05;

        const puBox = new THREE.Box3().setFromObject(pu);
        if (birdBox.intersectsBox(puBox)) {
            activatePowerUp();
            scene.remove(pu);
            powerUps.splice(i, 1);
            spawnParticles(pu.position, 0xFFD700);
            playSound('powerup');
        } else if (pu.position.x < -10) {
            scene.remove(pu);
            powerUps.splice(i, 1);
        }
    }
}

function updateClouds() {
    clouds.forEach(c => {
        c.position.x -= c.userData.speed;
        if (c.position.x < -25) {
            c.position.x = 25;
            c.position.y = (Math.random() * 10) - 2;
        }
    });
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.add(p.userData.vel);
        p.userData.life -= 0.02;
        
        if (p.userData.shrink) {
            p.scale.multiplyScalar(0.9);
        } else {
            p.rotation.x += 0.1;
        }

        if (p.userData.life <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
        }
    }
}

// --- EVENTS ---

function activatePowerUp() {
    activePowerUp = true;
    bird.mesh.children[0].material.color.setHex(0xFFD700); 
    bird.mesh.children[0].material.emissive.setHex(0xff0000);
    const indicator = document.getElementById('powerUpIndicator');
    indicator.style.opacity = 1;

    setTimeout(() => {
        activePowerUp = false;
        bird.mesh.children[0].material.color.setHex(0xffcc00);
        bird.mesh.children[0].material.emissive.setHex(0x000000);
        indicator.style.opacity = 0;
    }, 5000);
}

function showMotivation() {
    const el = document.getElementById('motivationalMessage');
    el.textContent = genZMotivations[Math.floor(Math.random() * genZMotivations.length)];
    el.classList.add('show');
    setTimeout(() => {
        el.classList.remove('show');
    }, 2000);
}

function updateScoreUI() {
    document.getElementById('scoreDisplay').textContent = score;
    if (score % 5 === 0 && score > 0) showMotivation();
}

function triggerGameOver() {
    if (isGameOver) return;
    isGameOver = true;
    playSound('crash');
    spawnParticles(bird.mesh.position, 0xffcc00);
    shakeCamera();
    
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappyHighScore', highScore);
        document.getElementById('highScoreDisplay').textContent = highScore;
    }
    
    setTimeout(() => {
        document.getElementById('gameOverScreen').style.display = 'flex';
    }, 500);
}

function shakeCamera() {
    const originalPos = camera.position.clone();
    let shakeDuration = 0.3;
    
    function shake() {
        if (shakeDuration > 0) {
            camera.position.x = originalPos.x + (Math.random() - 0.5) * 0.5;
            camera.position.y = originalPos.y + (Math.random() - 0.5) * 0.5;
            shakeDuration -= 0.05;
            requestAnimationFrame(shake);
        } else {
            camera.position.copy(originalPos);
        }
    }
    shake();
}

function resetGame() {
    isGameOver = false;
    isGameStarted = false;
    score = 0;
    updateScoreUI();
    
    document.getElementById('gameOverScreen').style.display = 'none';
    document.getElementById('startScreen').style.display = 'flex';
    
    bird.mesh.position.set(0, 0, 0);
    bird.velocity = 0;
    bird.mesh.rotation.z = 0;
    
    pipes.forEach(p => scene.remove(p.mesh));
    pipes = [];
    powerUps.forEach(p => scene.remove(p));
    powerUps = [];
    
    activePowerUp = false;
    bird.mesh.children[0].material.color.setHex(0xffcc00);
    bird.mesh.children[0].material.emissive.setHex(0x000000);
    document.getElementById('powerUpIndicator').style.opacity = 0;
}

// --- MAIN LOOP ---
function animate() {
    frameId = requestAnimationFrame(animate);
    
    if (isGameStarted && !isGameOver) {
        updatePhysics();
        updatePipes();
        updatePowerUps();
    } else if (!isGameStarted) {
        bird.mesh.position.y = Math.sin(Date.now() * 0.003) * 0.5;
    }

    updateClouds();
    updateParticles();
    
    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init();

</script>
</body></html>
