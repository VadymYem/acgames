<!DOCTYPE html>
<html lang="en">
<head>
<base target="_parent">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#2c3f51">

    <link rel="stylesheet" href="style.css">
    <script defer src="main.js"></script>
    <title>Menja | AuthorChe</title>
  <style>canvas { touch-action: none; } body { overscroll-behavior: none; }</style>

<!-- Universal Responsive Game Fix -->
<style id="ac-universal-responsive">
  html, body {
    max-width: 100vw !important;
    overflow-x: hidden !important;
    overscroll-behavior: none !important;
  }
  canvas {
    max-width: 100vw !important;
    max-height: 100vh !important;
    object-fit: contain !important;
    height: auto !important;
    width: auto !important;
    display: block;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  table, .container, #game-container, #board, #grid, .game-box, #app, main {
    max-width: 100vw !important;
    box-sizing: border-box !important;
  }
  img {
    max-width: 100% !important;
    height: auto !important;
  }
</style>

</head>
<body>
    <!-- Game canvas -->
<canvas id="c"></canvas>

<!-- Gameplay HUD -->
<div class="hud">
	<div class="hud__score">
		<div class="score-lbl"></div>
		<div class="cube-count-lbl"></div>
	</div>
	<div class="pause-btn"><div></div></div>
	<div class="slowmo">
		<div class="slowmo__bar"></div>
	</div>
</div>

<!-- Menu System -->
<div class="menus">
	<div class="menu menu--main">
		<h1>MENJA</h1>
		<button type="button" class="play-normal-btn">PLAY GAME</button>
		<button type="button" class="play-casual-btn">CASUAL MODE</button>
		<div class="credits"><a href="/games">AC-GAMES</a></div>
	</div>
	<div class="menu menu--pause">
		<h1>Paused</h1>
		<button type="button" class="resume-btn">RESUME GAME</button>
		<button type="button" class="menu-btn--pause">MAIN MENU</button>
	</div>
	<div class="menu menu--score">
		<h1>Game Over</h1>
		<h2>Your Score:</h2>
		<div class="final-score-lbl"></div>
		<div class="high-score-lbl"></div>
		<button type="button" class="play-again-btn">PLAY AGAIN</button>
		<button type="button" class="menu-btn--score">MAIN MENU</button>
	</div>
</div>
<a href="/donate.html" class="donate-button">Donate❤️</a><a href="/games/list.html" class="homepage-button">Exit</a>
</body>
