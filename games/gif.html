<h1>Draw Your Own Gif</h1>
<div id="canvas-container"></div>

<button class="tool active" id="brush">Brush</button>
<button class="tool" id="eraser">Eraser</button>
</div>
<input id="color-picker" type="color" value="#000000"/>
<button id="add-frame">Add Frame</button>
<div id="frame-rate-container">
<label for="frame-rate">Frame Rate (fps):</label>
<input id="frame-rate" max="30" min="1" step="1" type="range" value="2"/>
<span id="frame-rate-value">2</span>
</div>
<button id="create-gif">Create GIF</button>
</div>
<div id="loading">Creating GIF... Please wait.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script src="https://rawgit.com/antimatter15/jsgif/master/LZWEncoder.js"></script>
<script src="https://rawgit.com/antimatter15/jsgif/master/NeuQuant.js"></script>
<script src="https://rawgit.com/antimatter15/jsgif/master/GIFEncoder.js"></script>
<script>
    const canvasContainer = document.getElementById('canvas-container');
    const addFrameButton = document.getElementById('add-frame');
    const createGifButton = document.getElementById('create-gif');
    const colorPicker = document.getElementById('color-picker');
    const result = document.getElementById('result');
    const loading = document.getElementById('loading');
    const frameRateSlider = document.getElementById('frame-rate');
    const frameRateValue = document.getElementById('frame-rate-value');
    const brushTool = document.getElementById('brush');
    const eraserTool = document.getElementById('eraser');

    let frames = [];
    let currentCanvas;
    let isDrawing = false;
    let lastX, lastY;
    let currentTool = 'brush';

    function createCanvas() {
      const frameWrapper = document.createElement('div');
      frameWrapper.className = 'frame-wrapper';
      
      const canvas = document.createElement('canvas');
      canvas.width = 200;
      canvas.height = 200;
      
      const frameNumber = document.createElement('div');
      frameNumber.className = 'frame-number';
      frameNumber.textContent = `Frame ${frames.length + 1}`;
      
      const frameCheckbox = document.createElement('input');
      frameCheckbox.type = 'checkbox';
      frameCheckbox.className = 'frame-checkbox';
      frameCheckbox.addEventListener('change', () => {
        if (frameCheckbox.checked) {
          currentCanvas = canvas;
          highlightCurrentFrame();
        }
      });
      
      frameWrapper.appendChild(canvas);
      frameWrapper.appendChild(frameNumber);
      frameWrapper.appendChild(frameCheckbox);
      canvasContainer.appendChild(frameWrapper);
      
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseout', stopDrawing);
      
      frames.push(canvas);
      currentCanvas = canvas;
      highlightCurrentFrame();
    }

    function highlightCurrentFrame() {
      frames.forEach((canvas, index) => {
        const checkbox = canvas.parentElement.querySelector('.frame-checkbox');
        if (canvas === currentCanvas) {
          canvas.parentElement.style.border = '3px solid #ff6b6b';
          checkbox.checked = true;
        } else {
          canvas.parentElement.style.border = '3px solid #4ecdc4';
          checkbox.checked = false;
        }
      });
    }

    function startDrawing(e) {
      isDrawing = true;
      [lastX, lastY] = [e.offsetX, e.offsetY];
    }

    function draw(e) {
      if (!isDrawing) return;
      const ctx = currentCanvas.getContext('2d');
      if (currentTool === 'brush') {
        ctx.strokeStyle = colorPicker.value;
        ctx.lineWidth = 3;
      } else if (currentTool === 'eraser') {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 10;
      }
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
      [lastX, lastY] = [e.offsetX, e.offsetY];
    }

    function stopDrawing() {
      isDrawing = false;
    }

    addFrameButton.addEventListener('click', createCanvas);

    frameRateSlider.addEventListener('input', () => {
      frameRateValue.textContent = frameRateSlider.value;
    });

    createGifButton.addEventListener('click', () => {
      if (frames.length === 0) {
        alert("Please add at least one frame before creating a GIF.");
        return;
      }

      loading.style.display = 'block';
      result.innerHTML = '';

      const frameDelay = Math.round(1000 / frameRateSlider.value);

      const encoder = new GIFEncoder();
      encoder.setRepeat(0);
      encoder.setDelay(frameDelay);
      encoder.setSize(200, 200);
      encoder.start();

      frames.forEach(canvas => {
        encoder.addFrame(canvas.getContext('2d'));
      });

      encoder.finish();

      const binary_gif = encoder.stream().getData();
      const data_url = 'data:image/gif;base64,' + btoa(binary_gif);

      loading.style.display = 'none';
      const img = document.createElement('img');
      img.src = data_url;
      result.appendChild(img);
      
      const downloadLink = document.createElement('a');
      downloadLink.href = data_url;
      downloadLink.download = 'websim-animation.gif';
      downloadLink.textContent = 'Download GIF';
      result.appendChild(document.createElement('br'));
      result.appendChild(downloadLink);
    });

    brushTool.addEventListener('click', () => {
      currentTool = 'brush';
      brushTool.classList.add('active');
      eraserTool.classList.remove('active');
    });

    eraserTool.addEventListener('click', () => {
      currentTool = 'eraser';
      eraserTool.classList.add('active');
      brushTool.classList.remove('active');
    });

    createCanvas();
  </script>
