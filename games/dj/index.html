<script>
// AuthorChe Clean Game Wrapper - Ad & Tracker Blocker
window.PokiSDK = {
  init: function(){ return Promise.resolve(); },
  initWithVideoback: function(){ return Promise.resolve(); },
  customEvent: function(){},
  gameplayStart: function(){},
  gameplayStop: function(){},
  commercialBreak: function(){ return Promise.resolve(); },
  rewardedBreak: function(){ return Promise.resolve(true); },
  displayAd: function(){},
  destroyAd: function(){},
  setDebugTouchOverlayController: function(){},
  isAdBlocked: function(){ return false; }
};
window.CrazyGames = {
  SDK: {
    ad: {
      requestAd: function(type, callbacks){ if(callbacks && callbacks.adFinished) callbacks.adFinished(); },
      hasAdblock: function(){ return Promise.resolve(false); }
    },
    game: {
      gameplayStart: function(){},
      gameplayStop: function(){},
      happytime: function(){},
      loadingStart: function(){},
      loadingStop: function(){}
    },
    user: { isUserAccountAvailable: false }
  }
};
window.adsbygoogle = { push: function(){} };
window.open = function(url){ console.log("Blocked popup:", url); return null; };
</script>

<!-- Universal Responsive Game Fix -->
<style id="ac-universal-responsive">
  html, body {
    max-width: 100vw !important;
    overflow-x: hidden !important;
    overscroll-behavior: none !important;
  }
  canvas {
    max-width: 100vw !important;
    max-height: 100vh !important;
    object-fit: contain !important;
    height: auto !important;
    width: auto !important;
    display: block;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  table, .container, #game-container, #board, #grid, .game-box, #app, main {
    max-width: 100vw !important;
    box-sizing: border-box !important;
  }
  img {
    max-width: 100% !important;
    height: auto !important;
  }
</style>

</head>
  <style>
.donate-button {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background-color: #353d4a; /* Червоний колір кнопки */
    color: white;
    padding: 10px 0;
    text-align: center;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 16px;
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3);
    z-index: 1000; /* Зробити так, щоб кнопка була поверх іншого контенту */
}

.donate-button:hover {
    background-color: #e04040; /* Темно-червоний колір при наведенні */
}
.homepage-button {
    position: fixed;
    right: 10px;
    bottom: 10px;
    background-color: #007bff; /* Синій колір кнопки */
    color: white;
    padding: 10px 15px;
    text-decoration: none;
    border-radius: 5px;
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3);
    font-family: Arial, sans-serif;
    font-size: 14px;
}

.homepage-button:hover {
    background-color: #0056b3; /* Темно-синій колір при наведенні */
}</style>

      </div>

    <script src="/js/main.js"></script>
