<div id="game-wrapper">
<div class="hud">
<div>SCORE: <span id="score">0</span></div>
<div>BEST: <span id="best">0</span></div>
</div>
<canvas id="game"></canvas>
<div class="screen" id="start-screen">
<h1>Neon Snake</h1>
<p style="color: #aaa; margin-bottom: 20px;">Swipe or Arrows</p>
<button onclick="startGame()">START</button>
</div>
<div class="screen" id="game-over" style="display: none;">
<h1 style="-webkit-text-fill-color: #ff0055;">CRASHED</h1>
<p style="color: #fff; margin-bottom: 20px;">Score: <span id="final-score">0</span></p>
<button onclick="startGame()">RETRY</button>

<script>
    const canvas = document.getElementById('game');
    const context = canvas.getContext('2d');
    const grid = 20;
    
    let tileCountX = 0;
    let tileCountY = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    document.getElementById('best').innerText = highScore;

    let isGameOver = false;
    let speed = 7;
    let lastTime = 0;

    let snake = { x: 0, y: 0, dx: 1, dy: 0, cells: [], maxCells: 4, color: '#00ffcc' };
    let apple = { x: 0, y: 0, color: '#ff0055' };
    let particles = [];
    let shake = 0;
    let inputQueue = [];

    // --- АДАПТИВНІСТЬ ---
    function resizeGame() {
        // Відступи для кнопок і інтерфейсу
        const marginX = 20; 
        const marginY = 100; // Більше місця зверху/знизу для кнопок

        let availableWidth = window.innerWidth - marginX;
        let availableHeight = window.innerHeight - marginY;

        const w = Math.floor(availableWidth / grid) * grid;
        const h = Math.floor(availableHeight / grid) * grid;

        canvas.width = w;
        canvas.height = h;

        tileCountX = w / grid;
        tileCountY = h / grid;

        document.getElementById('game-wrapper').style.width = `${w}px`;
    }

    window.addEventListener('resize', resizeGame);
    resizeGame();

    // --- АУДІО ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'eat') {
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    // --- ЛОГІКА ---
    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-over').style.display = 'none';
        
        snake = { 
            x: Math.floor(tileCountX / 2), 
            y: Math.floor(tileCountY / 2), 
            dx: 1, dy: 0, 
            cells: [], 
            maxCells: 4, 
            color: '#00ffcc' 
        };
        snake.cells.push({x: snake.x, y: snake.y});
        
        score = 0;
        speed = 8;
        inputQueue = [];
        particles = [];
        isGameOver = false;
        
        updateUI();
        placeApple();
        requestAnimationFrame(loop);
    }

    function placeApple() {
        let valid = false;
        while (!valid) {
            apple.x = Math.floor(Math.random() * tileCountX);
            apple.y = Math.floor(Math.random() * tileCountY);
            valid = true;
            for (let cell of snake.cells) {
                if (cell.x === apple.x && cell.y === apple.y) {
                    valid = false;
                    break;
                }
            }
        }
    }

    function loop(timestamp) {
        if (isGameOver) return;
        requestAnimationFrame(loop);
        if ((timestamp - lastTime) < 1000 / speed) return;
        lastTime = timestamp;
        update();
        draw();
    }

    function update() {
        if (inputQueue.length > 0) {
            const nextDir = inputQueue.shift();
            if ((nextDir.dx !== 0 && snake.dx === 0) || (nextDir.dy !== 0 && snake.dy === 0)) {
                snake.dx = nextDir.dx;
                snake.dy = nextDir.dy;
            } else if (inputQueue.length > 0) {
                update(); return;
            }
        }

        snake.x += snake.dx;
        snake.y += snake.dy;

        if (snake.x < 0 || snake.x >= tileCountX || snake.y < 0 || snake.y >= tileCountY) {
            gameOver();
            return;
        }

        for (let i = 0; i < snake.cells.length; i++) {
            if (snake.x === snake.cells[i].x && snake.y === snake.cells[i].y) {
                gameOver();
                return;
            }
        }

        snake.cells.unshift({x: snake.x, y: snake.y});

        if (snake.x === apple.x && snake.y === apple.y) {
            snake.maxCells++;
            score += 10;
            if (score % 50 === 0 && speed < 18) speed += 1;
            playSound('eat');
            createParticles(apple.x * grid + grid/2, apple.y * grid + grid/2, '#ff0055');
            placeApple();
            updateUI();
        } else {
            snake.cells.pop();
        }

        for(let i = particles.length - 1; i >= 0; i--) {
            particles[i].life -= 0.1;
            particles[i].x += particles[i].vx;
            particles[i].y += particles[i].vy;
            if(particles[i].life <= 0) particles.splice(i, 1);
        }
    }

    function createParticles(x, y, color) {
        for(let i=0; i<8; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                life: 1.0,
                color: color
            });
        }
    }

    function draw() {
        context.clearRect(0, 0, canvas.width, canvas.height);

        context.save();
        if (shake > 0) {
            context.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            shake *= 0.8;
            if(shake < 0.5) shake = 0;
        }

        // Apple
        const pulse = Math.sin(Date.now() / 200) * 2;
        context.fillStyle = apple.color;
        context.shadowColor = apple.color;
        context.shadowBlur = 15;
        context.beginPath();
        context.arc(apple.x * grid + grid/2, apple.y * grid + grid/2, (grid/2) - 2 + pulse, 0, Math.PI*2);
        context.fill();
        context.shadowBlur = 0;

        // Snake
        snake.cells.forEach(function(cell, index) {
            context.fillStyle = snake.color;
            if (index === 0) {
                context.shadowBlur = 15;
                context.shadowColor = snake.color;
                context.fillStyle = '#ccffee';
            } else {
                context.shadowBlur = 0;
                context.globalAlpha = 1 - (index / snake.cells.length) * 0.5;
            }
            context.fillRect(cell.x * grid + 1, cell.y * grid + 1, grid - 2, grid - 2);
            context.globalAlpha = 1;

            if (index === 0) {
                context.fillStyle = '#000';
                let ex1, ey1, ex2, ey2;
                if (snake.dx === 1) { ex1=12; ey1=5; ex2=12; ey2=13; }
                else if (snake.dx === -1) { ex1=4; ey1=5; ex2=4; ey2=13; }
                else if (snake.dy === -1) { ex1=5; ey1=4; ex2=13; ey2=4; }
                else { ex1=5; ey1=12; ex2=13; ey2=12; }
                context.fillRect(cell.x*grid + ex1, cell.y*grid + ey1, 3, 3);
                context.fillRect(cell.x*grid + ex2, cell.y*grid + ey2, 3, 3);
            }
        });

        particles.forEach(p => {
            context.globalAlpha = p.life;
            context.fillStyle = p.color;
            context.fillRect(p.x, p.y, 3, 3);
            context.globalAlpha = 1;
        });

        context.restore();
    }

    function gameOver() {
        isGameOver = true;
        shake = 15;
        draw();
        playSound('die');
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('snake_highscore', highScore);
        }
        document.getElementById('final-score').innerText = score;
        document.getElementById('best').innerText = highScore;
        setTimeout(() => document.getElementById('game-over').style.display = 'flex', 300);
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('best').innerText = highScore;
    }

    // Input
    function handleInput(dx, dy) {
        if (inputQueue.length < 2) inputQueue.push({dx, dy});
    }

    document.addEventListener('keydown', function(e) {
        if (isGameOver) return;
        if (e.which === 37) handleInput(-1, 0);
        else if (e.which === 38) handleInput(0, -1);
        else if (e.which === 39) handleInput(1, 0);
        else if (e.which === 40) handleInput(0, 1);
    });

    let touchStartX = 0;
    let touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
        e.preventDefault();
    }, {passive: false});

    canvas.addEventListener('touchend', e => {
        let touchEndX = e.changedTouches[0].screenX;
        let touchEndY = e.changedTouches[0].screenY;
        let dx = touchEndX - touchStartX;
        let dy = touchEndY - touchStartY;
        
        if (Math.abs(dx) > Math.abs(dy)) {
            if (Math.abs(dx) > 30) dx > 0 ? handleInput(1, 0) : handleInput(-1, 0);
        } else {
            if (Math.abs(dy) > 30) dy > 0 ? handleInput(0, 1) : handleInput(0, -1);
        }
        e.preventDefault();
    }, {passive: false});

</script>
</body></html>
