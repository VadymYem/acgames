      <meta charset="utf-8">

      <title>Cyber Maze: Infinite | AuthorChe</title>
      <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
      <style>
         body {
            background-color: #050510;
            color: #00f3ff;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            touch-action: none;
         }

         /* UI Header */
         .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            box-sizing: border-box;
            background: rgba(0,0,0,0.5);
            z-index: 10;
         }
         
         h1 { margin: 0; font-size: 20px; color: #bc13fe; text-shadow: 0 0 10px #bc13fe; }
         .stats { font-size: 16px; color: #fff; }

         /* Game Container */
         #game-container {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
         }

         canvas {
            background: #0a0a15;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            border: 2px solid #333;
         }

         /* Virtual Controls (D-Pad) */
         .controls {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 10px;
            margin-bottom: 20px;
            z-index: 20;
         }

         .btn-pad {
            width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 10px;
            color: #00f3ff;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
         }
         .btn-pad:active { background: rgba(0, 243, 255, 0.3); transform: scale(0.95); }
         
         #bu { grid-column: 2; grid-row: 1; }
         #bl { grid-column: 1; grid-row: 2; }
         #bd { grid-column: 2; grid-row: 2; }
         #br { grid-column: 3; grid-row: 2; }

         /* Overlays */
         .overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 50;
         }
         
         .overlay h2 { font-size: 40px; color: #bc13fe; margin-bottom: 10px; }
         .overlay p { color: #aaa; margin-bottom: 30px; }
         
         .action-btn {
            background: transparent;
            color: #00f3ff;
            border: 2px solid #00f3ff;
            padding: 15px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
         }
         .action-btn:hover { background: #00f3ff; color: #000; box-shadow: 0 0 30px #00f3ff; }

         /* Navigation Buttons */
         .nav-buttons {
            position: fixed;
            width: 100%;
            height: 0; /* Just a container */
            top: 0; left: 0;
            pointer-events: none;
            z-index: 100;
         }

         .nav-btn {
            pointer-events: auto;
            position: absolute;
            text-decoration: none;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
         }

         .donate-btn { top: 60px; left: 20px; border: 1px solid #ff0055; color: #ff0055; background: rgba(255,0,85,0.1); }
         .exit-btn { bottom: 20px; right: 20px; border: 1px solid #fff; color: #fff; background: rgba(255,255,255,0.1); }
         .restart-btn { top: 60px; right: 20px; border: 1px solid #bc13fe; color: #bc13fe; background: rgba(188, 19, 254, 0.1); }
         
         /* Hide controls on desktop if wanted, but good to keep for accessibility */
         @media (min-width: 768px) {
            .controls { opacity: 0.5; } 
            .controls:hover { opacity: 1; }
         }
      </style>
   
<!-- Universal Responsive Game Fix -->

   <body>
   
      <div class="nav-buttons">
         <a href="/donate.html" class="nav-btn donate-btn">Donate</a>
         <a href="/games/list.html" class="nav-btn exit-btn">Exit</a>
         <a href="#" onclick="Game.resetLevel()" class="nav-btn restart-btn">Restart</a>
      </div>

      <header class="header">
         <h1>CYBER MAZE</h1>
         <div class="stats">Level: <span id="level-display">1</span></div>
      </header>
      
      <div id="game-container">
         <canvas id="mazeCanvas"></canvas>
         
         <div id="start-screen" class="overlay">
            <h2>MAZE RUNNER</h2>
            <p>Find the Portal</p>
            <button class="action-btn" onclick="Game.start()">INITIALIZE</button>
         </div>
         
         <div id="win-screen" class="overlay" style="display: none;">
            <h2 style="color: #00f3ff;">COMPLETE</h2>
            <p>Loading next sector...</p>
         </div>
      </div>

      <div class="controls">
         <div class="btn-pad" id="bu" onclick="Game.move('up')">▲</div>
         <div class="btn-pad" id="bl" onclick="Game.move('left')">◄</div>
         <div class="btn-pad" id="bd" onclick="Game.move('down')">▼</div>
         <div class="btn-pad" id="br" onclick="Game.move('right')">►</div>
      </div>

      <script>
         /**
          * AUDIO ENGINE
          */
         const AudioEngine = {
            ctx: new (window.AudioContext || window.webkitAudioContext)(),
            play(type) {
               if(this.ctx.state === 'suspended') this.ctx.resume();
               const osc = this.ctx.createOscillator();
               const gain = this.ctx.createGain();
               osc.connect(gain);
               gain.connect(this.ctx.destination);
               const now = this.ctx.currentTime;

               if(type === 'step') {
                  osc.type = 'triangle';
                  osc.frequency.setValueAtTime(100, now);
                  osc.frequency.exponentialRampToValueAtTime(50, now + 0.05);
                  gain.gain.setValueAtTime(0.1, now);
                  gain.gain.linearRampToValueAtTime(0, now + 0.05);
                  osc.start(now); osc.stop(now + 0.05);
               } else if (type === 'win') {
                  osc.type = 'sine';
                  osc.frequency.setValueAtTime(400, now);
                  osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                  gain.gain.setValueAtTime(0.2, now);
                  gain.gain.linearRampToValueAtTime(0, now + 0.5);
                  osc.start(now); osc.stop(now + 0.5);
               } else if (type === 'bump') {
                  osc.type = 'sawtooth';
                  osc.frequency.setValueAtTime(50, now);
                  gain.gain.setValueAtTime(0.1, now);
                  gain.gain.linearRampToValueAtTime(0, now + 0.1);
                  osc.start(now); osc.stop(now + 0.1);
               }
            }
         };

         /**
          * MAZE GENERATION & LOGIC
          */
         const Game = {
            canvas: document.getElementById('mazeCanvas'),
            ctx: document.getElementById('mazeCanvas').getContext('2d'),
            cols: 0, rows: 0, w: 0,
            grid: [],
            current: null,
            player: { i: 0, j: 0 },
            goal: { i: 0, j: 0 },
            level: 1,
            isInputBlocked: false,

            init() {
               this.resize();
               window.addEventListener('resize', () => this.resize());
               this.setupControls();
            },

            resize() {
               // Make canvas fit the central area nicely
               const size = Math.min(window.innerWidth - 20, window.innerHeight - 200);
               this.canvas.width = size;
               this.canvas.height = size;
               // Determine cell size based on level
               const baseCols = 10;
               this.cols = baseCols + Math.floor(this.level / 2);
               this.rows = this.cols;
               this.w = size / this.cols;
               
               if(this.grid.length > 0) this.draw(); // Redraw if resizing mid-game
            },

            start() {
               document.getElementById('start-screen').style.display = 'none';
               this.generateMaze();
            },
            
            resetLevel() {
               this.generateMaze();
            },

            generateMaze() {
               this.resize();
               this.grid = [];
               for(let j=0; j<this.rows; j++){
                  for(let i=0; i<this.cols; i++){
                     this.grid.push(new Cell(i, j, this.w));
                  }
               }
               
               // Recursive Backtracker
               let current = this.grid[0];
               current.visited = true;
               let stack = [];

               // Instant Generation loop
               while(true) {
                  let next = current.checkNeighbors(this.grid, this.cols, this.rows);
                  if(next) {
                     next.visited = true;
                     stack.push(current);
                     this.removeWalls(current, next);
                     current = next;
                  } else if (stack.length > 0) {
                     current = stack.pop();
                  } else {
                     break;
                  }
               }

               this.player = { i: 0, j: 0 };
               this.goal = { i: this.cols-1, j: this.rows-1 };
               this.isInputBlocked = false;
               this.draw();
            },

            removeWalls(a, b) {
               let x = a.i - b.i;
               if(x === 1) { a.walls[3] = false; b.walls[1] = false; }
               else if(x === -1) { a.walls[1] = false; b.walls[3] = false; }
               let y = a.j - b.j;
               if(y === 1) { a.walls[0] = false; b.walls[2] = false; }
               else if(y === -1) { a.walls[2] = false; b.walls[0] = false; }
            },

            index(i, j) {
               if(i < 0 || j < 0 || i > this.cols-1 || j > this.rows-1) return -1;
               return i + j * this.cols;
            },

            draw() {
               this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
               
               // Draw Walls
               this.ctx.strokeStyle = "#00f3ff";
               this.ctx.lineWidth = 2;
               this.ctx.shadowBlur = 10;
               this.ctx.shadowColor = "#00f3ff";
               
               for(let i=0; i<this.grid.length; i++) {
                  this.grid[i].show(this.ctx, this.w);
               }
               this.ctx.shadowBlur = 0;

               // Draw Goal
               const gw = this.w;
               const gx = this.goal.i * gw + gw/2;
               const gy = this.goal.j * gw + gw/2;
               
               this.ctx.fillStyle = "#bc13fe";
               this.ctx.shadowBlur = 15;
               this.ctx.shadowColor = "#bc13fe";
               this.ctx.beginPath();
               this.ctx.arc(gx, gy, gw/3, 0, Math.PI*2);
               this.ctx.fill();

               // Draw Player
               const pw = this.w;
               const px = this.player.i * pw + pw/2;
               const py = this.player.j * pw + pw/2;

               this.ctx.fillStyle = "#fff";
               this.ctx.shadowColor = "#fff";
               this.ctx.beginPath();
               this.ctx.arc(px, py, pw/4, 0, Math.PI*2);
               this.ctx.fill();
               this.ctx.shadowBlur = 0;
            },

            move(dir) {
               if(this.isInputBlocked) return;

               let currentCell = this.grid[this.index(this.player.i, this.player.j)];
               let moved = false;

               if (dir === 'up' && !currentCell.walls[0]) {
                  this.player.j--; moved = true;
               } else if (dir === 'right' && !currentCell.walls[1]) {
                  this.player.i++; moved = true;
               } else if (dir === 'down' && !currentCell.walls[2]) {
                  this.player.j++; moved = true;
               } else if (dir === 'left' && !currentCell.walls[3]) {
                  this.player.i--; moved = true;
               }

               if(moved) {
                  AudioEngine.play('step');
                  this.draw();
                  this.checkWin();
               } else {
                  AudioEngine.play('bump');
               }
            },

            checkWin() {
               if(this.player.i === this.goal.i && this.player.j === this.goal.j) {
                  this.isInputBlocked = true;
                  AudioEngine.play('win');
                  
                  document.getElementById('win-screen').style.display = 'flex';
                  setTimeout(() => {
                     document.getElementById('win-screen').style.display = 'none';
                     this.level++;
                     document.getElementById('level-display').innerText = this.level;
                     this.generateMaze();
                  }, 1500);
               }
            },

            setupControls() {
               // Keyboard
               document.addEventListener('keydown', (e) => {
                  if(e.key === 'ArrowUp' || e.key === 'w') this.move('up');
                  if(e.key === 'ArrowRight' || e.key === 'd') this.move('right');
                  if(e.key === 'ArrowDown' || e.key === 's') this.move('down');
                  if(e.key === 'ArrowLeft' || e.key === 'a') this.move('left');
               });

               // Swipe
               let touchStartX = 0;
               let touchStartY = 0;
               this.canvas.addEventListener('touchstart', e => {
                  touchStartX = e.changedTouches[0].screenX;
                  touchStartY = e.changedTouches[0].screenY;
                  e.preventDefault();
               }, {passive: false});

               this.canvas.addEventListener('touchend', e => {
                  let dx = e.changedTouches[0].screenX - touchStartX;
                  let dy = e.changedTouches[0].screenY - touchStartY;
                  if(Math.abs(dx) > Math.abs(dy)) {
                     if(Math.abs(dx) > 30) dx > 0 ? this.move('right') : this.move('left');
                  } else {
                     if(Math.abs(dy) > 30) dy > 0 ? this.move('down') : this.move('up');
                  }
                  e.preventDefault();
               }, {passive: false});
            }
         };

         /**
          * CELL CLASS
          */
         class Cell {
            constructor(i, j, w) {
               this.i = i;
               this.j = j;
               this.walls = [true, true, true, true]; // Top, Right, Bottom, Left
               this.visited = false;
            }

            checkNeighbors(grid, cols, rows) {
               let neighbors = [];
               let top = grid[Game.index(this.i, this.j - 1)];
               let right = grid[Game.index(this.i + 1, this.j)];
               let bottom = grid[Game.index(this.i, this.j + 1)];
               let left = grid[Game.index(this.i - 1, this.j)];

               if (top && !top.visited) neighbors.push(top);
               if (right && !right.visited) neighbors.push(right);
               if (bottom && !bottom.visited) neighbors.push(bottom);
               if (left && !left.visited) neighbors.push(left);

               if (neighbors.length > 0) {
                  let r = Math.floor(Math.random() * neighbors.length);
                  return neighbors[r];
               } else {
                  return undefined;
               }
            }

            show(ctx, w) {
               let x = this.i * w;
               let y = this.j * w;
               
               ctx.beginPath();
               if (this.walls[0]) { ctx.moveTo(x, y); ctx.lineTo(x + w, y); }
               if (this.walls[1]) { ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + w); }
               if (this.walls[2]) { ctx.moveTo(x + w, y + w); ctx.lineTo(x, y + w); }
               if (this.walls[3]) { ctx.moveTo(x, y + w); ctx.lineTo(x, y); }
               ctx.stroke();
            }
         }

         // Init Game
         Game.init();

      </script>
   </body>
