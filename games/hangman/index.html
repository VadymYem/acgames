<!-- Universal Responsive Game Fix -->
<style id="ac-universal-responsive">
  html, body {
    max-width: 100vw !important;
    overflow-x: hidden !important;
    overscroll-behavior: none !important;
  }
  canvas {
    max-width: 100vw !important;
    max-height: 100vh !important;
    object-fit: contain !important;
    height: auto !important;
    width: auto !important;
    display: block;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  table, .container, #game-container, #board, #grid, .game-box, #app, main {
    max-width: 100vw !important;
    box-sizing: border-box !important;
  }
  img {
    max-width: 100% !important;
    height: auto !important;
  }
</style>

</head>
<body>
    <div class="game-modal">
        <div class="content">
            <img src="#" alt="gif">
            <h4>Game Over!</h4>
            <p>The correct word was: <b>rainbow</b></p>
            <button class="play-again">Play Again</button>
        </div>
    </div>
    <div class="container">
        <div class="hangman-box">
            <img src="#" draggable="false" alt="hangman-img">
            <h1>Hangman Game</h1>
        </div>
        <div class="game-box">
            <ul class="word-display"></ul>
            <h4 class="hint-text">Hint: <b></b></h4>
            <h4 class="guesses-text">Incorrect guesses: <b></b></h4>
            <div class="keyboard"></div>
        </div>
    </div>
