<!DOCTYPE html>
<html lang="en">
<head>
<base target="_parent">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6LN7QL6SP2"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-6LN7QL6SP2');
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Gorillas | AuthorChe</title>
  <style>canvas { touch-action: none; } body { overscroll-behavior: none; }</style>

<!-- Universal Responsive Game Fix -->
<style id="ac-universal-responsive">
  html, body {
    max-width: 100vw !important;
    overflow-x: hidden !important;
    overscroll-behavior: none !important;
  }
  canvas {
    max-width: 100vw !important;
    max-height: 100vh !important;
    object-fit: contain !important;
    height: auto !important;
    width: auto !important;
    display: block;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  table, .container, #game-container, #board, #grid, .game-box, #app, main {
    max-width: 100vw !important;
    box-sizing: border-box !important;
  }
  img {
    max-width: 100% !important;
    height: auto !important;
  }
</style>

</head>
<body>

<canvas id="game"></canvas>

<svg width="200" height="250" id="windmill">
  <defs>
    <path id="arm" d="M -7 -20 C -7 -10 7 -10 7 -20 L 2 -80 L -2 -80" />
  </defs>
  <g transform="translate(100, 100)">
    <g id="windmill-head">
      <circle r="8"></circle>
      <use href="#arm" />
      <use href="#arm" transform="rotate(+120)" />
      <use href="#arm" transform="rotate(-120)" />
    </g>
  </g>
  <path
    transform="translate(100, 0)"
    d="M -7 250 L 7 250 L 3 115 L -3 115"
  ></path>
</svg>

<div id="wind-info">Wind Speed: <span id="wind-speed">0</span></div>

<div id="info-left">
  <h3><span class="name">Player</span></h3>
  <p>Angle: <span class="angle">0</span>°</p>
  <p>Velocity: <span class="velocity">0</span></p>
</div>

<div id="info-right">
  <h3><span class="name">Computer</span></h3>
  <p>Angle: <span class="angle">0</span>°</p>
  <p>Velocity: <span class="velocity">0</span></p>
</div>

<div id="instructions">
  <h3 id="game-mode">Player vs. Computer</h3>
  <h1>Drag the bomb to aim!</h1>
</div>

<div id="bomb-grab-area"></div>

<div id="congratulations">
  <h1><span id="winner">?</span> won!</h1>  
  <div class="dropdown">
    <button class="dropbtn">New Game</button>
    <div class="dropdown-content">
      <a href="#" class="single-player">Single Player</a>
      <a href="#" class="two-players">Two-Player</a>
      <a href="#" class="auto-play">Autoplay</a>
    </div>
  </div>
</div>

<div id="settings">
  <div class="dropdown">
    <button class="dropbtn">New Game</button>
    <div class="dropdown-content">
      <a href="#" class="single-player">Single Player</a>
      <a href="#" class="two-players">Two-Players</a>
      <a href="#" class="auto-play">Autoplay</a>
    </div>
  </div>

  <button id="color-mode">Dark Mode</button>
</div>
<a href="/donate.html" class="donate-button">Donate❤️</a>
<a href="/games/list.html" class="homepage-button">Exit</a>
</body>
</html>
