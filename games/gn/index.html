<!-- Universal Responsive Game Fix -->
<style id="ac-universal-responsive">
  html, body {
    max-width: 100vw !important;
    overflow-x: hidden !important;
    overscroll-behavior: none !important;
  }
  canvas {
    max-width: 100vw !important;
    max-height: 100vh !important;
    object-fit: contain !important;
    height: auto !important;
    width: auto !important;
    display: block;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  table, .container, #game-container, #board, #grid, .game-box, #app, main {
    max-width: 100vw !important;
    box-sizing: border-box !important;
  }
  img {
    max-width: 100% !important;
    height: auto !important;
  }
</style>

  <body>
    <div class="wrapper">
      <header>Guess a number from 1 to 100</header>
      <p class="guess"></p>
      <div class="input-field">
        <input type="number" />
        <button>Check</button>
      </div>
      <p>You have <span class="chances">10</span> chances</p>
    </div>


    <script src="script.js" defer></script>
