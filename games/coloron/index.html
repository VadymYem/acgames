<!-- Universal Responsive Game Fix -->
<style id="ac-universal-responsive">
  html, body {
    max-width: 100vw !important;
    overflow-x: hidden !important;
    overscroll-behavior: none !important;
  }
  canvas {
    max-width: 100vw !important;
    max-height: 100vh !important;
    object-fit: contain !important;
    height: auto !important;
    width: auto !important;
    display: block;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  table, .container, #game-container, #board, #grid, .game-box, #app, main {
    max-width: 100vw !important;
    box-sizing: border-box !important;
  }
  img {
    max-width: 100% !important;
    height: auto !important;
  }
</style>

</head>

<body>
    <div class="splash"></div>
    <div class="container">

        <div class="start-game game-full-flex" id="start-game">

            <div class="start-game-top"><a class="play-full-page"
                    target="_blank" rel="noopener noreferrer">Full Page Mode</a></div>

            <div class="logo-holder">
                <p class="logo">
                    <span>C</span>
                    <span>o</span>
                    <span>l</span>
                    <span>o</span>
                    <span>r</span>
                    <span>o</span>
                    <span>n</span>
                </p>
                <a class="play-button" href="#" onclick="game.start()">Play</a>
                <h4 class="hint">hint: <span>red</span> color always comes first</h4>
            </div>

            <div class="how-to-play">
                <div class="section section-1">
                    <h4>Bouncing ball<br>changes color</h4>
                    <div class="content">
                        <div class="ball-demo" id="ball-demo"></div>
                    </div>
                </div>
                <div class="section section-2">
                    <h4>Tap on the bar to switch the colors<br>(Red, Yellow, Purple)</h4>
                    <div class="content">
                        <div class="bar bar-1" data-index="0"></div>
                        <div class="bar bar-2"></div>
                        <div class="bar bar-3"></div>
                    </div>
                </div>
                <div class="section section-3">
                    <h4>Always match the<br>ball and bar colors</h4>
                    <div class="content">
                        <div class="ball-demo" id="ball-demo"></div>
                        <div class="bar bar-1"></div>
                    </div>
                </div>
            </div>

        </div>

        <div class="stop-game game-full-flex">

            <div class="score-container">

                <h1>Coloron</h1>

                <div class="final-score"></div>
                <div class="result"></div>

                <h4>Tweet to challenge friends</h4>
                <div>
                    <a class="play-again" href="#" onclick="game.start()">Play Again</a>
                    <a class="main-menu" href="#" onclick="game.intro()">Menu</a>
                </div>

            </div>

        </div>

        <div class="small-glows"></div>

        <div class="glow">
            <div class="sun"></div>
        </div>

        <div class="waves">
            <div class="top_wave"></div>
            <div class="wave1"></div>
            <div class="wave2"></div>
            <div class="wave3"></div>
            <div class="wave4"></div>
        </div>

        <div class="mounts">
            <div class="mount1"></div>
            <div class="mount2"></div>
        </div>

        <div class="clouds"></div>

        <div class="scene">
            <div class="learn-to-play">Click on the bars to change the color!</div>
            <div class="score" id="score"></div>
            <div class="ball-holder"></div>
            <div class="sticks" id="sticks"></div>
        </div>

        <div class="noise"></div>

    </div>
    <script src="../../shared/vendor/jquery.min.js"></script>
    <script src="../../shared/vendor/TweenMax.min.js"></script>
    <script src="main.js"></script>
</body>
