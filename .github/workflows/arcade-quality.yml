name: Original games gameplay
on:
  push:
    branches: [main]
    paths: ['shared/arcade*', 'tests/arcade*', 'games/klondike/**', 'games/spider/**', 'games/mahjong/**', 'games/sokoban/**', 'games/wordsearch/**', 'games/draughts/**', 'games/reversi/**', 'games/battleship/**', 'games/fruit-merge/**', 'games/music-lab/**', '.github/workflows/arcade-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, android, ios]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/arcade.test.cjs
      - run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium webkit
      - name: Serve local source
        run: python3 -m http.server 4173 --bind 0.0.0.0 >/tmp/arcade-http.log 2>&1 &
      - name: Gameplay and persistence in the production iframe sandbox
        env:
          GAME_DEVICE: ${{ matrix.device }}
        run: node tests/arcade-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-${{ matrix.device }}
          path: reports/arcade/${{ matrix.device }}/
          retention-days: 14
