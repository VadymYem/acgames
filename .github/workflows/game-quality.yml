name: AuthorChe game quality
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: games-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run audit
      - run: npm run syntax
      - run: npm test
      - run: python3 tests/sanitize.test.py
      - uses: actions/upload-artifact@v4
        with:
          name: game-static-reports
          path: reports/*.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-artwork
          path: |
            shared/covers/
            catalog.json
          retention-days: 7
  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, android, ios]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Run every supported game with load and input checks
        env:
          GAME_DEVICE: ${{ matrix.device }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/games-http.log 2>&1 &
          node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-browser-${{ matrix.device }}
          path: reports/browser/${{ matrix.device }}/
          retention-days: 7
