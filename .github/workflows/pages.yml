name: Publish AuthorChe Games
on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - 'shared/**'
      - 'tools/**'
      - 'tests/**'
      - 'catalog.json'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: authorche-games-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run audit
      - run: npm run syntax
      - run: npm test
      - run: python3 tests/sanitize.test.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed runtime
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          reporting_interval: 15000
