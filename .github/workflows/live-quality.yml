name: Verify published games
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Sandbox checks the cross-origin iframe; website also checks the protected public domain'
        required: false
        type: choice
        default: sandbox
        options: [sandbox, website]
      game_ids:
        description: 'Optional game IDs separated by commas; empty checks all published games'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-quality.yml'
      - 'tests/browser.mjs'
  workflow_run:
    workflows: ['Publish AuthorChe Games']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: published-games-${{ github.event_name }}-${{ inputs.target || 'sandbox' }}-${{ inputs.game_ids || 'all' }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, android, ios]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Test every published game in a cross-origin iframe
        env:
          GAME_DEVICE: ${{ matrix.device }}
          GAME_BASE_URL: https://vadymyem.github.io/acgames/
          GAME_EMBED_URL: ${{ inputs.target == 'website' && 'https://authorche.top/games/play.html' || 'http://127.0.0.1:4174/tests/embedded-player.html' }}
          GAME_IDS: ${{ inputs.game_ids || '' }}
          GAME_PUBLISHED_ONLY: 'true'
          GAME_REQUIRE_ALL: 'true'
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/iframe-check.log 2>&1 &
          node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-games-${{ matrix.device }}
          path: reports/browser/
          retention-days: 7
