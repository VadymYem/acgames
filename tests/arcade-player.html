<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AuthorChe gameplay test</title><style>body{margin:0;background:#0b1422}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="gameFrame" title="Гра" sandbox="allow-scripts allow-same-origin allow-pointer-lock" allow="fullscreen; gamepad" referrerpolicy="no-referrer"></iframe><script>
'use strict';
const id=new URLSearchParams(location.search).get('id');
const status=document.createElement('p');status.id='gameStatus';status.textContent='Завантаження гри';document.body.prepend(status);
window.addEventListener('message',event=>{if(event.source===document.getElementById('gameFrame').contentWindow&&event.origin==='http://127.0.0.1:4173'&&event.data?.source==='authorche-game'&&event.data.type==='ac-game-loaded')status.hidden=true;});
if(['klondike','spider','mahjong','sokoban','wordsearch','draughts','reversi','battleship','fruit-merge','music-lab'].includes(id))document.getElementById('gameFrame').src='http://127.0.0.1:4173/games/'+id+'/index.html';
</script></body></html>
